name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The soldier's prediction runs the server's physics, built to WASM from crates/sim-wasm.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # The version crates/sim-wasm/Cargo.toml pins.
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - name: Build WASM
        run: npm run build:wasm
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      # Includes parity.spec.ts and consts-parity.spec.ts, which check the TS mirrors against the Rust tables.
      - name: Test
        run: npx vitest run

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      # Maths, the allocator, the scene graph and glTF parsing on the game's own models.
      - name: Test
        run: npx vitest run
