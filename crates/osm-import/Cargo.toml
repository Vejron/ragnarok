[package]
name = "osm-import"
version.workspace = true
edition.workspace = true
default-run = "osm-import"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
earcutr = "0.5"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
serde.workspace = true
serde_json = "1"
rmp-serde.workspace = true
shared.workspace = true
tiff = { version = "0.11.3", features = ["zstd"] }
laz = "0.9"
osmpbf = "0.3"
rayon = "1"
png = "0.18"
webp = "0.3"
zune-core = "0.5"
zune-jpeg = "0.5"
