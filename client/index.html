<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9fd3f0">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ragnarok</title>
    <!-- The loading screen (`src/LoadingScreen.vue`), styled here so it is drawn before the script arrives. -->
    <style>
      .loading {
        position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 16px; text-align: center; color: white; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        background: linear-gradient(rgba(20, 40, 60, 0.45), rgba(20, 40, 60, 0.45)), #9fd3f0;
      }
      .loading h1 { margin: 0; font-size: clamp(40px, 10vw, 88px); letter-spacing: 0.08em; transform: rotate(-3deg); }
      .loading-bar { width: min(320px, 70vw); height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.28); }
      .loading-bar div { height: 100%; border-radius: 999px; background: white; transition: width 0.25s ease-out; }
      .loading-now { margin: 0; font-size: 18px; font-weight: 800; }
      .loading-stages { margin: 0; padding: 0; list-style: none; font-size: 14px; font-weight: 700; text-align: left; min-height: 9.5em; }
      .loading-stages li { display: flex; gap: 8px; line-height: 1.55; opacity: 0.55; }
      .loading-stages li::before { content: '○'; width: 1em; text-align: center; }
      .loading-stages .running { opacity: 1; }
      .loading-stages .running::before { content: '●'; animation: loading-pulse 0.9s ease-in-out infinite alternate; }
      .loading-stages .done { opacity: 0.8; }
      .loading-stages .done::before { content: '✓'; }
      .loading-stages .failed { opacity: 1; color: #ffe066; }
      .loading-stages .failed::before { content: '✕'; }
      .loading-error { margin: 0; max-width: min(560px, 100%); padding: 8px 14px; border-radius: 10px; background: #ffe066; color: #1d2b36; font-weight: 700; text-shadow: none; }
      .loading-leave-active { transition: opacity 0.35s ease-out; pointer-events: none; }
      .loading-leave-to { opacity: 0; }
      @keyframes loading-pulse { from { opacity: 0.35; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .loading-stages .running::before { animation: none; } .loading-bar div { transition: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- What `LoadingScreen.vue` draws before anything has started; Vue replaces it when it mounts. -->
      <div class="loading" role="status">
        <h1>RAGNAROK</h1>
        <div class="loading-bar"><div style="width: 0%"></div></div>
        <p class="loading-now">Loading the game</p>
        <ul class="loading-stages"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
